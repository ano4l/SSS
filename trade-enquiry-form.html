<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0a0a0a"><title>Trade Enquiry | The Diplomatic Informer</title><link rel="icon" href="/assets/favicon.svg"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600&family=IBM+Plex+Mono:wght@500&family=Public+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"><style>
:root{color-scheme:dark;--p:#0a0a0a;--l:#302f29;--t:#faf9f5;--m:#aaa79b;--g:#989809;--w:#990025;--er:#ff9aae;--ok:#c1cd76}*{box-sizing:border-box}body{min-width:320px;min-height:100svh;margin:0;color:var(--t);background:radial-gradient(ellipse 80% 45% at 50% -5%,#31310a60,transparent 70%),var(--p);font:16px/1.5 'Public Sans',sans-serif}.shell{width:min(100%,820px);margin:auto;padding:26px 16px 40px}.brand{display:flex;justify-content:center;margin-bottom:24px}.brand img{height:43px;max-width:100%;object-fit:contain}.panel{border:1px solid var(--l);border-top:2px solid var(--g);background:linear-gradient(145deg,#191916,#11110f);box-shadow:0 30px 90px #0009}.inner{padding:25px 18px 27px}.back{display:inline-flex;min-height:48px;align-items:center;color:var(--m);font-size:13px;text-decoration:none}.back:hover{color:var(--t)}.back:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid var(--g);outline-offset:3px}.eyebrow{margin:11px 0 14px;color:#c0c037;font:500 10px/1.3 'IBM Plex Mono',monospace;letter-spacing:.17em;text-transform:uppercase}h1{margin:0;font:600 clamp(30px,8vw,48px)/1.04 Archivo,sans-serif;letter-spacing:-.04em}.intro{margin:15px 0 0;color:var(--m);font-weight:300;line-height:1.65}form{margin-top:30px;padding-top:28px;border-top:1px solid var(--l)}.grid{display:grid;gap:18px}.field{display:flex;flex-direction:column;gap:8px;min-width:0}.wide{grid-column:1/-1}label{font-size:13px;font-weight:500}.optional{color:#77756c;font-size:11px;font-weight:400}input,select,textarea{width:100%;min-height:50px;border:1px solid var(--l);border-radius:0;background:#10100f;color:var(--t);padding:0 13px;font:400 16px/1.35 'Public Sans',sans-serif}textarea{min-height:165px;padding:12px 13px;resize:vertical}.consent{display:flex;gap:11px;align-items:flex-start;margin-top:23px;color:var(--m);font-size:13px}.consent input{width:20px;min-width:20px;min-height:20px;margin:0;accent-color:var(--g)}button{width:100%;min-height:54px;margin-top:24px;border:1px solid #ffffff1c;background:var(--w);color:#fff;cursor:pointer;font:600 14px 'Public Sans',sans-serif}button:hover:not(:disabled){background:#79001d}button:disabled{opacity:.6;cursor:wait}.status{min-height:25px;margin:13px 0 0;font-size:14px}.status[data-state=error]{color:var(--er)}.status[data-state=success]{color:var(--ok)}.honeypot{position:absolute!important;left:-10000px!important;width:1px!important;height:1px!important;overflow:hidden}.contact{margin:0;padding:20px 18px;border-top:1px solid var(--l);color:var(--m);font-size:12px;text-align:center}.contact a{color:var(--t);text-decoration-color:var(--g);text-underline-offset:4px}@media(min-width:620px){.shell{padding:50px 24px}.inner{padding:42px 48px 38px}.grid{grid-template-columns:1fr 1fr;gap:21px 24px}.contact{padding:24px 48px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}</style></head><body><main class="shell"><header class="brand"><img src="/assets/logo-new-white.png" alt="The Diplomatic Informer — International Trade and Investment"></header><section class="panel" aria-labelledby="title"><div class="inner"><a class="back" href="/enquiry">← Back to enquiry pathways</a><p class="eyebrow">Trade &amp; Investment / Commercial enquiry</p><h1 id="title">Submit a Trade Enquiry.</h1><p class="intro">This form is for a specific trade, business, investment or commercial matter. It is not a directory listing application.</p><form id="trade-form" novalidate><div class="grid"><div class="field"><label for="fullName">Full name</label><input id="fullName" name="fullName" autocomplete="name" maxlength="120" required></div><div class="field"><label for="organisation">Organisation / company <span class="optional">Optional</span></label><input id="organisation" name="organisation" autocomplete="organization" maxlength="160"></div><div class="field"><label for="email">Business email</label><input id="email" name="email" type="email" inputmode="email" autocomplete="email" maxlength="254" required></div><div class="field"><label for="country">Country / market</label><input id="country" name="country" autocomplete="country-name" maxlength="100" required></div><div class="field"><label for="enquiryType">Enquiry focus</label><select id="enquiryType" name="enquiryType" required><option value="" selected disabled>Select a focus</option><option>Trade facilitation</option><option>Investment opportunity</option><option>Market entry / partnership</option><option>Sourcing / distribution</option><option>Commercial opportunity</option><option>Other</option></select></div><div class="field"><label for="sector">Relevant sector <span class="optional">Optional</span></label><input id="sector" name="sector" maxlength="160"></div><div class="field"><label for="timeframe">Indicative timeframe <span class="optional">Optional</span></label><input id="timeframe" name="timeframe" maxlength="160" placeholder="e.g. Q1 2027"></div><div class="field"><label for="opportunitySize">Opportunity size / investment range <span class="optional">Optional</span></label><input id="opportunitySize" name="opportunitySize" maxlength="160"></div><div class="field wide"><label for="message">Detailed enquiry</label><textarea id="message" name="message" minlength="10" maxlength="5000" required aria-describedby="message-help"></textarea><small id="message-help" class="optional">10–5,000 characters.</small></div></div><label class="consent"><input name="consent" type="checkbox" required><span>I confirm that the information supplied is accurate and I would like the Trade &amp; Investment division to contact me about this enquiry.</span></label><div class="honeypot" aria-hidden="true"><label for="website">Website</label><input id="website" name="website" tabindex="-1" autocomplete="off"></div><button type="submit" id="submit">Submit Trade Enquiry</button><p class="status" id="status" role="status" aria-live="polite" aria-atomic="true"></p></form></div><p class="contact"><a href="mailto:tradeinvestment@diplomaticinformer.com">tradeinvestment@diplomaticinformer.com</a></p></section></main><script>(()=>{const f=document.querySelector('form'),b=document.querySelector('#submit'),s=document.querySelector('#status'),def=b.textContent;const set=(x,state='')=>{s.textContent=x;s.dataset.state=state};f.addEventListener('submit',async e=>{e.preventDefault();set('');if(!f.checkValidity()){f.reportValidity();set('Please complete the required fields.','error');return}let d=Object.fromEntries(new FormData(f));if(d.website){f.reset();set('Thank you. Your enquiry has been sent successfully.','success');return}b.disabled=true;b.textContent='Sending…';f.setAttribute('aria-busy','true');try{let r=await fetch('/api/contact',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({...d,formType:'trade_enquiry'})}),j=await r.json().catch(()=>({}));if(!r.ok||!j.ok)throw Error();f.reset();set('Thank you. Your trade enquiry has been sent successfully.','success')}catch{set('We could not send your enquiry. Please try again.','error')}finally{b.disabled=false;b.textContent=def;f.removeAttribute('aria-busy')}})})();</script></body></html>
