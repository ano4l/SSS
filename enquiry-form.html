<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0A0A0A">
  <meta name="description" content="Send a trade and investment enquiry to The Diplomatic Informer.">
  <meta property="og:title" content="Trade &amp; Investment Enquiry | The Diplomatic Informer">
  <meta property="og:description" content="Tell us what you are looking for and our team will respond directly.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://www.diplomaticinformerinvestments.com/assets/og-image.jpg">
  <title>Trade &amp; Investment Enquiry | The Diplomatic Informer</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600&amp;family=IBM+Plex+Mono:wght@500&amp;family=Public+Sans:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --page: #0a0a0a;
      --surface: #141412;
      --field: #10100f;
      --border: #2a2a24;
      --border-strong: #444438;
      --text: #faf9f5;
      --muted: #a9a79c;
      --gold: #989809;
      --burgundy: #990025;
      --burgundy-hover: #7a001d;
      --success: #b9c86a;
      --error: #ff91a9;
      font-synthesis: none;
    }

    * { box-sizing: border-box; }

    html { background: var(--page); }

    body {
      min-width: 320px;
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      color: var(--text);
      background:
        radial-gradient(ellipse 70% 35% at 50% -8%, rgba(152, 152, 9, .13), transparent 72%),
        var(--page);
      font-family: "Public Sans", "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .page-shell {
      width: min(100%, 760px);
      margin: 0 auto;
      padding: max(30px, env(safe-area-inset-top)) 16px max(38px, env(safe-area-inset-bottom));
    }

    .identity {
      display: flex;
      justify-content: center;
      margin: 0 0 28px;
      opacity: 0;
      animation: rise-in .55s ease-out .05s forwards;
    }

    .identity img {
      display: block;
      width: auto;
      height: 45px;
      max-width: min(100%, 300px);
      object-fit: contain;
    }

    .form-panel {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--border);
      background: linear-gradient(145deg, rgba(24, 24, 21, .98), rgba(18, 18, 16, .99));
      box-shadow: 0 28px 90px rgba(0, 0, 0, .44), inset 0 1px 0 rgba(255, 255, 255, .02);
      opacity: 0;
      animation: rise-in .65s cubic-bezier(.2, .7, .2, 1) .12s forwards;
    }

    .form-panel::before {
      content: "";
      position: absolute;
      inset: 0 0 auto;
      height: 2px;
      background: linear-gradient(90deg, transparent 4%, var(--gold) 32%, #c0bd31 50%, var(--gold) 68%, transparent 96%);
      box-shadow: 0 0 22px rgba(152, 152, 9, .38);
    }

    .form-inner { padding: 30px 20px 24px; }

    .eyebrow {
      margin: 0 0 16px;
      color: #b4b421;
      font-family: "IBM Plex Mono", Consolas, monospace;
      font-size: 10px;
      font-weight: 500;
      line-height: 1.4;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 590px;
      margin: 0;
      font-family: Archivo, "Arial Narrow", sans-serif;
      font-size: clamp(29px, 8.1vw, 46px);
      font-weight: 600;
      line-height: 1.06;
      letter-spacing: -.036em;
      text-wrap: balance;
    }

    .intro {
      max-width: 530px;
      margin: 15px 0 0;
      color: var(--muted);
      font-size: 15px;
      font-weight: 300;
      line-height: 1.65;
    }

    form {
      margin-top: 30px;
      padding-top: 28px;
      border-top: 1px solid var(--border);
    }

    .fields {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 19px;
    }

    .field {
      display: flex;
      min-width: 0;
      flex-direction: column;
      gap: 8px;
    }

    .field--wide { grid-column: 1 / -1; }

    label {
      color: var(--text);
      font-size: 13px;
      font-weight: 500;
      line-height: 1.2;
    }

    .optional {
      margin-left: 5px;
      color: #78776e;
      font-size: 11px;
      font-weight: 400;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 0;
      outline: none;
      background: var(--field);
      color: var(--text);
      font: 400 16px/1.35 "Public Sans", "Segoe UI", sans-serif;
      transition: border-color .18s ease, background-color .18s ease, box-shadow .18s ease;
    }

    input,
    select {
      min-height: 50px;
      padding: 0 14px;
    }

    select {
      padding-right: 42px;
      appearance: none;
      background-image:
        linear-gradient(45deg, transparent 50%, var(--muted) 50%),
        linear-gradient(135deg, var(--muted) 50%, transparent 50%);
      background-position:
        calc(100% - 19px) 22px,
        calc(100% - 14px) 22px;
      background-size: 5px 5px, 5px 5px;
      background-repeat: no-repeat;
    }

    textarea {
      min-height: 138px;
      padding: 13px 14px;
      resize: vertical;
    }

    input:hover,
    select:hover,
    textarea:hover { border-color: var(--border-strong); }

    input:focus-visible,
    select:focus-visible,
    textarea:focus-visible {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(152, 152, 9, .13);
      background-color: #171714;
    }

    .honeypot {
      position: absolute !important;
      left: -10000px !important;
      width: 1px !important;
      height: 1px !important;
      overflow: hidden !important;
    }

    .submit-row { margin-top: 24px; }

    button {
      display: inline-flex;
      width: 100%;
      min-height: 54px;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255, 255, 255, .1);
      border-radius: 0;
      background: var(--burgundy);
      box-shadow: inset 0 1px rgba(255, 255, 255, .12), 0 10px 30px rgba(153, 0, 37, .16);
      color: var(--text);
      cursor: pointer;
      font: 600 14px/1 "Public Sans", "Segoe UI", sans-serif;
      transition: background-color .18s ease, transform .18s ease, box-shadow .18s ease;
    }

    button:hover:not(:disabled) {
      background: var(--burgundy-hover);
      box-shadow: inset 0 1px rgba(255, 255, 255, .12), 0 13px 34px rgba(153, 0, 37, .24);
      transform: translateY(-1px);
    }

    button:focus-visible {
      outline: 3px solid rgba(250, 249, 245, .9);
      outline-offset: 3px;
    }

    button:active:not(:disabled) { transform: translateY(1px); }

    button:disabled {
      cursor: wait;
      opacity: .65;
    }

    .status {
      min-height: 25px;
      margin: 13px 0 0;
      font-size: 14px;
      line-height: 1.6;
    }

    .status[data-state="success"] { color: var(--success); }
    .status[data-state="error"] { color: var(--error); }

    .direct-contact {
      margin: 4px 20px 0;
      padding: 21px 0 24px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 12px;
      line-height: 1.75;
      text-align: center;
    }

    .direct-contact a {
      color: var(--text);
      text-decoration-color: rgba(152, 152, 9, .75);
      text-decoration-thickness: 1px;
      text-underline-offset: 4px;
    }

    .direct-contact a:hover { color: #c2c236; }

    .direct-contact a:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 4px;
    }

    @media (min-width: 640px) {
      .page-shell { padding: 48px 24px 56px; }
      .identity { margin-bottom: 32px; }
      .identity img { height: 52px; }
      .form-inner { padding: 46px 48px 34px; }
      .fields { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px 24px; }
      form { margin-top: 36px; padding-top: 34px; }
      .submit-row { display: flex; align-items: center; gap: 22px; margin-top: 28px; }
      button { width: auto; min-width: 175px; padding: 0 27px; }
      .status { flex: 1; margin: 0; }
      .direct-contact { margin: 2px 48px 0; padding: 24px 0 32px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }

    @keyframes rise-in {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <main class="page-shell">
    <header class="identity">
      <img src="/assets/logo-new-white.png" alt="The Diplomatic Informer — International Trade &amp; Investment">
    </header>

    <section class="form-panel" aria-labelledby="page-title">
      <div class="form-inner">
        <p class="eyebrow">Trade &amp; Investment Enquiry</p>
        <h1 id="page-title">Let's build the next business relationship.</h1>
        <p class="intro">Tell us what you are looking for and our team will respond directly.</p>

        <form id="enquiry-form" novalidate>
          <div class="fields">
            <div class="field">
              <label for="fullName">Name</label>
              <input id="fullName" name="fullName" type="text" autocomplete="name" maxlength="120" required>
            </div>

            <div class="field">
              <label for="organisation">Organisation <span class="optional">Optional</span></label>
              <input id="organisation" name="organisation" type="text" autocomplete="organization" maxlength="160">
            </div>

            <div class="field">
              <label for="email">Email</label>
              <input id="email" name="email" type="email" inputmode="email" autocomplete="email" maxlength="254" required>
            </div>

            <div class="field">
              <label for="enquiryType">Enquiry type</label>
              <select id="enquiryType" name="enquiryType" required>
                <option value="" selected disabled>Select an enquiry type</option>
                <option value="Trade facilitation">Trade facilitation</option>
                <option value="Investment opportunity">Investment opportunity</option>
                <option value="Directory membership">Directory membership</option>
                <option value="Media and partnerships">Media and partnerships</option>
                <option value="Other">Other</option>
              </select>
            </div>

            <div class="field field--wide">
              <label for="message">Message</label>
              <textarea id="message" name="message" rows="5" minlength="10" maxlength="5000" required></textarea>
            </div>
          </div>

          <div class="honeypot" aria-hidden="true">
            <label for="website">Website</label>
            <input id="website" name="website" type="text" tabindex="-1" autocomplete="off">
          </div>

          <div class="submit-row">
            <button id="submit-button" type="submit">Send enquiry</button>
            <p id="form-status" class="status" role="status" aria-live="polite" aria-atomic="true"></p>
          </div>
        </form>
      </div>

      <p class="direct-contact">
        <a href="mailto:tradeinvestment@diplomaticinformer.com">tradeinvestment@diplomaticinformer.com</a><br>
        <a href="tel:+27121411704">012 141 1704</a>
      </p>
    </section>
  </main>

  <script>
    (() => {
      const form = document.getElementById('enquiry-form');
      const button = document.getElementById('submit-button');
      const status = document.getElementById('form-status');
      const defaultLabel = 'Send enquiry';

      function setStatus(message, state = '') {
        status.textContent = message;
        status.dataset.state = state;
      }

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        setStatus('');

        if (!form.checkValidity()) {
          form.reportValidity();
          setStatus('Please complete the required fields.', 'error');
          return;
        }

        const data = Object.fromEntries(new FormData(form).entries());
        button.disabled = true;
        button.textContent = 'Sending…';
        form.setAttribute('aria-busy', 'true');

        try {
          const response = await fetch('/api/contact', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Accept': 'application/json'
            },
            body: JSON.stringify({
              fullName: data.fullName,
              organisation: data.organisation,
              email: data.email,
              enquiryType: data.enquiryType,
              message: data.message,
              website: data.website
            })
          });

          const result = await response.json().catch(() => ({}));
          if (!response.ok || !result.ok) {
            throw new Error(result.error || 'We could not send your enquiry. Please try again.');
          }

          form.reset();
          setStatus('Thank you. Your enquiry has been sent successfully.', 'success');
        } catch (error) {
          const fallback = 'We could not send your enquiry. Please try again.';
          setStatus(error instanceof Error && error.message ? error.message : fallback, 'error');
        } finally {
          button.disabled = false;
          button.textContent = defaultLabel;
          form.removeAttribute('aria-busy');
        }
      });
    })();
  </script>
</body>
</html>
